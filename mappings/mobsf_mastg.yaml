# MobSF 네이티브 분류 → MASTG-TEST / MASVS 매핑 테이블 (§5, §8).
#
# 이 Phase 의 실질 노동량 대부분(§8 "숨은 공수"). 미매핑은 normalizer 가
# 별도 버킷(unmapped)으로 분류하고, 여기에 점진 추가해 보완한다.
#
# MobSF 최신 버전은 code_analysis 항목에 metadata.masvs / metadata.owasp-mobile 를
# 이미 포함한다. normalizer 는 (1) 이 테이블 우선, (2) 없으면 MobSF metadata 폴백,
# (3) 둘 다 없으면 unmapped 순으로 해석한다.
#
# 키 = MobSF code_analysis 규칙 id (또는 매니페스트/인증서 점검 id).

version: 1

# --- Android code_analysis 규칙 id ---
rules:
  android_insecure_random:
    mastg_ids: ["MASTG-TEST-0204"]
    masvs_ids: ["MASVS-CRYPTO-1"]
    category: "MASVS-CRYPTO"

  android_weak_hash:
